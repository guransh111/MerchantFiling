# Look and feel, following "unslop" passes (unslop by Damir Sokolovsky, @heydamir, CC BY 4.0).
# Direction: a compliance desk at night. Dark by default: soft graphite greys, sections on slightly
# raised panels, soft rounded corners, one cobalt accent. IBM Plex Sans for text, IBM Plex Mono for
# figures. Everyone sees the dark theme; the light palette in app/ui.py is used only if a viewer
# picks Streamlit's Light theme from the menu.

[server]
# CSV/Excel uploads up to 200 MB
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
# hide Streamlit's developer toolbar (Deploy button etc.) in the finished product
toolbarMode = "viewer"

[theme]
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
headingFont = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
baseFontSize = 15
headingFontWeights = [500, 500, 500, 500, 500, 500]
headingFontSizes = ["28px", "22px", "18px", "15px", "15px", "14px"]
metricValueFontSize = "26px"
metricValueFontWeight = 500
baseRadius = "10px"
buttonRadius = "10px"
linkUnderline = false
showWidgetBorder = true

# graphite at night: the page, raised panels one step lighter, controls one step lighter again
base = "dark"
primaryColor = "#3a76c4"
backgroundColor = "#111113"
secondaryBackgroundColor = "#222226"
textColor = "#ededef"
linkColor = "#7aa8e3"
borderColor = "#2a2a2f"
dataframeBorderColor = "#2a2a2f"
dataframeHeaderBackgroundColor = "#1f1f23"
dataframeHeaderTextColor = "#a1a1a8"
blueColor = "#5b93d9"
greenColor = "#4cc38a"
redColor = "#e5484d"
orangeColor = "#d08a3a"
yellowColor = "#d4a72c"
chartCategoricalColors = ["#5b93d9", "#6e6e76", "#d08a3a", "#e0703f", "#9a9aa2", "#d05a5a"]

[theme.sidebar]
backgroundColor = "#0b0b0d"
secondaryBackgroundColor = "#1a1a1d"
borderColor = "#1f1f23"
